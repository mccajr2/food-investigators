openapi: 3.0.3
info:
  title: Quickapp API
  version: 0.17.0
  description: >
    Contract-first API for Food Investigators. Documents family-account auth
    (email/password register and login, Bearer session tokens, GET/PATCH
    /api/auth/me with optional household childDisplayName, and dismissible
    household welcome orientation), the household food
    catalog (system starters + custom foods, archive, optional snack foods
    excluded from tasting sessions, household exposure profiles per food +
    variant including attempt hooks, optional signup bootstrap of safe
    exposures, outcome-driven exposure upserts on session complete, and parent-
    nominated stretch targets for Suggest path bias), tasting
    sessions (create, list upcoming, history of completed, download history PDF,
    suggest next with optional adjacent invent food, stretch-target path bias,
    and calm pacing evidence,
    get, update, cancel, complete with run outcomes, optional parent notes on
    completed sessions), and household Insights (aggregates + dismissible tips).
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/auth/register:
    post:
      operationId: register
      summary: Register a parent account and create a household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: parent@example.com
              password: password1
              rememberMe: true
              childDisplayName: Alex
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Email already registered
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: parent@example.com
              password: password1
              rememberMe: true
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid email or password
  /api/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current Bearer session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/welcome-orientation/dismiss:
    post:
      operationId: dismissWelcomeOrientation
      summary: Dismiss the one-shot welcome orientation for this household
      description: >
        Persists dismissal on the household so the welcome panel does not
        reappear on other devices or browsers. Idempotent (repeat dismiss
        returns 200 with welcomeOrientationDismissed true).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Welcome dismissed (or already dismissed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/me:
    get:
      operationId: me
      summary: Return the current parent, household id, and optional child display name
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateMe
      summary: Update household profile fields for the signed-in parent
      description: >
        Sets the household's optional child display first name (trim; blank or
        null clears to null; max 40 characters; rejects control characters).
        Display-only for parent UI — not used on therapist PDF / History headers
        or Suggest briefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            example:
              childDisplayName: Alex
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request (e.g. name too long or control characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/foods:
    get:
      operationId: listFoods
      summary: List system starters plus this household's foods
      security:
        - bearerAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            When false (default), only active household foods are included with
            system starters. When true, archived household foods are included too.
      responses:
        "200":
          description: Foods for the current household
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createFood
      summary: Create a household food
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFoodRequest"
            example:
              name: Extra apple mash
              iconKey: apple
      responses:
        "201":
          description: Food created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        "400":
          description: Invalid request or icon key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid icon key
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Name already used by a starter or active household food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: A food with that name already exists
  /api/foods/bootstrap-safes:
    post:
      operationId: bootstrapSafeFoods
      summary: Bootstrap safe exposures after signup (match-or-create)
      description: >
        For each item, match a visible system starter by case-insensitive name
        or create a household food (`custom_<slug>` icon). Upserts a `safe`
        exposure with source `signup`. Snacks use `sessionEligible: false`.
        At most 10 items; duplicate name+variant in one request is rejected.
        Empty `items` is a no-op.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapSafesRequest"
            example:
              items:
                - name: Apples
                  variantKey: Honeycrisp
                  sessionEligible: true
                - name: Cucumber
                  sessionEligible: true
                - name: Goldfish
                  sessionEligible: false
      responses:
        "200":
          description: Exposures upserted (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodExposureResponse"
        "400":
          description: >
            Too many items, blank name, duplicate name+variant in the request,
            or other invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            Invented name collides with an active household food that is not a
            system starter match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: A food with that name already exists
  /api/foods/stretch-targets:
    get:
      operationId: listStretchTargets
      summary: List parent-nominated stretch destinations
      description: >
        Returns active stretch targets for this household (food + variant),
        sorted by food name then variant key. Used by Suggest for C-lite path
        bias; parents manage the queue on Foods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active stretch targets (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StretchTargetResponse"
              example:
                - id: dddddddd-dddd-dddd-dddd-dddddddddddd
                  foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa24
                  foodName: Broccoli
                  variantKey: steamed
                  createdAt: "2026-08-03T18:00:00Z"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: addStretchTarget
      summary: Nominate a stretch destination (existing food or invent by name)
      description: >
        Provide either `foodId` (visible tasting food) or `name` (match system
        or household tasting food by case-insensitive name, else invent a
        household tasting food with `custom_<slug>` icon — not marked safe).
        Soft cap of 5 active targets. Duplicate food+variant returns 409.
        Snacks (`sessionEligible: false`) are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStretchTargetRequest"
            examples:
              byFoodId:
                summary: Existing catalog food
                value:
                  foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa24
                  variantKey: Steamed
              byName:
                summary: Invent or match by name
                value:
                  name: Ground beef
                  variantKey: taco night
      responses:
        "201":
          description: Stretch target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StretchTargetResponse"
        "400":
          description: >
            Cap reached, neither/both foodId and name, snack food, blank name,
            or other invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: At most 5 stretch targets can be active
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: foodId not visible to this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: That stretch target is already on the list (or invent name collision)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: That stretch target is already on the list
  /api/foods/stretch-targets/{foodId}:
    delete:
      operationId: removeStretchTarget
      summary: Remove a stretch destination
      description: >
        Deletes the active stretch target for `(foodId, variantKey)`.
        `variantKey` is normalized (trim + case-fold); omit or blank clears the
        unspecified-presentation row.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FoodId"
        - name: variantKey
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            default: ""
          description: Brand/prep note; normalized with trim + case-fold
      responses:
        "204":
          description: Stretch target removed
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Food or stretch target not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/foods/{foodId}:
    put:
      operationId: updateFood
      summary: Update a household food name and/or icon
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FoodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFoodRequest"
            example:
              name: Updated mash
              iconKey: sweet_potato
      responses:
        "200":
          description: Food updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        "400":
          description: Invalid request or icon key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: System starter foods cannot be changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: System starter foods cannot be changed
        "404":
          description: Food not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Name already used by a starter or active household food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: A food with that name already exists
  /api/foods/{foodId}/archive:
    post:
      operationId: archiveFood
      summary: Soft-archive a household food
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FoodId"
      responses:
        "200":
          description: Food archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: System starter foods cannot be changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Food not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/foods/{foodId}/exposures:
    put:
      operationId: upsertFoodExposure
      summary: Upsert a household exposure profile for a food presentation
      description: >
        Sets familiarity for `(foodId, variantKey)` for this household.
        `variantKey` is normalized (trim + case-fold); omit or blank for
        unspecified presentation. Works for system starters (overlay) and
        household foods. Source is always `manual` on this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FoodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFoodExposureRequest"
            example:
              variantKey: Bagelsaurus
              familiarity: safe
      responses:
        "200":
          description: Exposure upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodExposureResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Food not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: clearFoodExposure
      summary: Clear (delete) a household exposure for a food presentation
      description: >
        Removes the exposure row for `(foodId, variantKey)` so Plan no longer
        autofills that familiarity. `variantKey` query is normalized the same
        way as upsert; omit or blank clears the unspecified-presentation row.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FoodId"
        - name: variantKey
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            default: ""
          description: Brand/prep note; normalized with trim + case-fold
      responses:
        "204":
          description: Exposure cleared (idempotent if already absent)
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Food not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/sessions:
    get:
      operationId: listUpcomingSessions
      summary: List planned tasting sessions for this household (earliest date first)
      description: >
        Returns sessions with status `planned`, ordered by `scheduledOn` ascending.
        Cancelled sessions are omitted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upcoming planned sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createSession
      summary: Create a planned tasting session with exactly two foods
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            example:
              scheduledOn: "2026-07-20"
              foods:
                - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa04
                  familiarity: safe
                  variantNote: Honeycrisp
                - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa05
                  familiarity: truly_new
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: >
            Invalid request — wrong food count, missing familiarity, unknown or
            archived foods, invalid familiarity, `scheduledOn` in the past, or
            same `foodId` in both slots without two different non-blank
            `variantNote`s
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                pastDate:
                  value:
                    message: Scheduled date can't be in the past
                sameFoodVariants:
                  value:
                    message: Same food needs two different brand/variety notes
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            A planned or completed session already exists for this household on
            that `scheduledOn` (cancelled sessions do not occupy the day)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: A session already exists on that date
  /api/sessions/history:
    get:
      operationId: listSessionHistory
      summary: List completed tasting sessions for this household (newest first)
      description: >
        Returns sessions with status `completed`, ordered by `scheduledOn`
        descending then `updatedAt` descending. Planned and cancelled sessions
        are omitted. Each item reuses `SessionResponse` including per-food
        run outcomes. Read-only — use get by id for a single completed session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Completed session history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/sessions/history.pdf:
    get:
      operationId: exportSessionHistoryPdf
      summary: Download completed tasting history as a PDF
      description: >
        Returns a PDF packet of sessions with status `completed`, ordered by
        `scheduledOn` descending then `updatedAt` descending (same as history
        list). Optional `from` and `to` (ISO-8601 dates) filter inclusively on
        `scheduledOn`. Omit both for the full completed history. Empty filtered
        results still return 200 with a PDF that states no sessions matched.
        Packet header is generic (product title + generated date + range) —
        no parent email or household id. Planned and cancelled sessions are
        omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date on scheduledOn (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end date on scheduledOn (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: PDF tasting-history packet
          headers:
            Content-Disposition:
              description: Attachment filename for the PDF download
              schema:
                type: string
                example: attachment; filename="tasting-history.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Invalid request — malformed date, or `from` after `to`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/sessions/suggestions/next:
    get:
      operationId: suggestNextSession
      summary: Propose the next tasting night (draft — not persisted)
      description: >
        Returns a draft proposal with exactly two foods, familiarity each, a
        `scheduledOn` (next UTC calendar day without a planned or completed
        session), optional short rationale, calm pacing evidence (`pacingNote` +
        optional `citations` from a curated pack keyed by pace hint), and
        `source` of `ai` or `heuristic`. When the household has stretch targets,
        Suggest prefers path-shaped invents/candidates toward those destinations
        and may propose a destination itself only when a simple readiness gate
        passes (never on pull_back; cool-down after recent hard reject). When AI
        is used and the household has at least one safe exposure, at most one
        slot may be an invent (`foodId` null + `proposedName`); the other must
        be a catalog safe-anchor food. Invent does not create catalog foods —
        Approve (client) match-or-creates then uses `POST /api/sessions`.
        Heuristic never invents. AI is used when completed-session count is
        Insights-ready (>= 3) and Gemini is configured; otherwise or on invalid
        picks, heuristic fallback still returns 200. Requires at least two
        selectable catalog foods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft next-session proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSuggestionResponse"
              example:
                scheduledOn: "2026-07-16"
                foods:
                  - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa04
                    name: Apples
                    iconKey: apple
                    familiarity: safe
                  - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa05
                    name: Strawberries
                    iconKey: strawberry
                    familiarity: familiar_but_new
                rationale: A calm next night from foods that often work for you.
                source: heuristic
                pacingNote: Keep a calm, balanced night — foods that often work, without rushing.
                citations:
                  - title: Calm tasting rhythm
                    source: Family mealtime and exposure guidance for picky eating
        "400":
          description: >
            Fewer than two session-eligible foods available to suggest from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Need at least two session-eligible foods to suggest a night
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get one tasting session for this household
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Session not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      operationId: updateSession
      summary: Update a still-planned tasting session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
            example:
              scheduledOn: "2026-07-22"
              foods:
                - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa05
                  familiarity: familiar_but_new
                  variantNote: "TJ's"
                - foodId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa13
                  familiarity: safe
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: >
            Invalid request — foods not selectable, `scheduledOn` in the past, or
            same `foodId` in both slots without two different non-blank
            `variantNote`s
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                pastDate:
                  value:
                    message: Scheduled date can't be in the past
                sameFoodVariants:
                  value:
                    message: Same food needs two different brand/variety notes
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Session not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            Session is not editable (cancelled or completed), or another planned
            or completed session already occupies the target `scheduledOn`
            (cancelled does not occupy the day; editing the same session on its
            current date is allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                notEditable:
                  value:
                    message: Session cannot be edited
                dayOccupied:
                  value:
                    message: A session already exists on that date
  /api/sessions/{sessionId}/cancel:
    post:
      operationId: cancelSession
      summary: Soft-cancel a planned tasting session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Session not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            Session is not editable — already cancelled or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Session cannot be edited
  /api/sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      summary: Record run outcomes for both foods and mark the session completed
      description: >
        Persists per-food run outcomes (icon prompts + optional notes) and sets
        session status to `completed`. Only allowed while the session is still
        `planned`. Completed sessions are omitted from the default upcoming list.
        Also upserts household exposure profiles for each food + normalized
        variant: `liked=like` and `ateEnough=true` → `safe` / `outcome`; other
        outcomes → `retrying` / `outcome` unless the exposure is already `safe`
        (never auto-downgraded). Always increments attempt hooks on that key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionRequest"
            example:
              foods:
                - position: 1
                  liked: like
                  texture: crunchy
                  temperature: cold
                  smell: like
                  tastes: [sweet, salty]
                  whyNote: crunchy
                  changeNote: less peel
                  ateEnough: true
                - position: 2
                  liked: no
                  texture: wet
                  temperature: warm
                  ateEnough: false
      responses:
        "200":
          description: Session completed with outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request or outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Session not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Session is cancelled or already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Session cannot be edited
  /api/sessions/{sessionId}/parent-note:
    patch:
      operationId: updateSessionParentNote
      summary: Save or clear optional parent notes on a completed session
      description: >
        Sets `parentNote` on a `completed` tasting session (trim; blank or null
        clears to null; max 2000 characters). Planned or cancelled sessions
        return 409. Does not reopen general session update for completed rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateParentNoteRequest"
            example:
              parentNote: Tired after school; clinic was loud
      responses:
        "200":
          description: Parent note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request (e.g. note too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Session not found for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Session is not completed (planned or cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Parent notes can only be saved on completed sessions
  /api/insights:
    get:
      operationId: getInsights
      summary: Household tasting insights and tips
      description: >
        Aggregates completed session outcomes with snack liked/texture preferences.
        Taste basics (`topLikedTastes`) come from session outcomes only (liked=like
        with non-empty tastes); snacks do not contribute tastes. Ready when
        completedSessionCount >= 3; tips are empty until ready. Tips exclude ids
        this household has dismissed (up to 3 tips from a fixed catalog).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insights for this household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/insights/tips/{tipId}/dismiss:
    post:
      operationId: dismissInsightTip
      summary: Remember dismissing an Insights tip for this household
      description: >
        Persists dismissal of a known tip id. Idempotent (repeat dismiss returns 200).
        Unknown tip id returns 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TipId"
      responses:
        "200":
          description: Tip dismissed (or already dismissed)
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Unknown tip id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Unknown tip id: not_a_real_tip"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  parameters:
    FoodId:
      name: foodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TipId:
      name: tipId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        example: keep_going
      description: >
        Fixed tip catalog id (e.g. slow_down_truly_new, lean_into_texture,
        lean_into_taste, lean_into_why_like, notice_why_dislike,
        celebrate_ate_enough, mix_familiarity, keep_going).
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque server-side session token from register or login
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: parent@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: password1
        rememberMe:
          type: boolean
          default: true
          description: >
            When true (default), session lasts 30 days and clients may persist the
            token. When false, session lasts 12 hours and clients must not persist
            across process death.
        childDisplayName:
          type: string
          maxLength: 40
          nullable: true
          description: >
            Optional child's first name for parent-facing Plan/Run/celebration
            copy. Trimmed on save; omit, blank, or null leaves the household
            name unset. Rejects control characters. Not shown on therapist PDF
            or History shareables.
          example: Alex
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: parent@example.com
        password:
          type: string
          format: password
          example: password1
        rememberMe:
          type: boolean
          default: true
          description: Same semantics as RegisterRequest.rememberMe
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Opaque Bearer token for subsequent authenticated calls
          example: "a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456"
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      required:
        - id
        - email
        - householdId
        - welcomeOrientationDismissed
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: parent@example.com
        householdId:
          type: string
          format: uuid
        childDisplayName:
          type: string
          maxLength: 40
          nullable: true
          description: >
            Optional household child display first name when set; null when
            unset. Single-child beta field on the household (multi-child may
            later migrate this).
          example: Alex
        welcomeOrientationDismissed:
          type: boolean
          description: >
            True once the household has dismissed the one-shot welcome
            orientation panel; false until then (including for existing
            households that have never seen it).
          example: false
    UpdateMeRequest:
      type: object
      properties:
        childDisplayName:
          type: string
          maxLength: 40
          nullable: true
          description: >
            Optional child's first name. Trimmed on save; blank or null clears
            the stored name. Rejects control characters.
          example: Alex
    ErrorMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Unauthorized
    FoodIconKey:
      type: string
      maxLength: 64
      description: >
        Starter illustration key (e.g. apple, sweet_potato) or a generated
        household key `custom_<slug>` derived from the food name (e.g.
        custom_cucumber). Clients render custom keys from the name (emoji when
        known, otherwise initials).
      pattern: "^([a-z0-9_]+|custom_[a-z0-9]+(?:_[a-z0-9]+){0,15})$"
      example: custom_cucumber
    FoodResponse:
      type: object
      required:
        - id
        - name
        - iconKey
        - system
        - sessionEligible
        - exposures
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Apples
        iconKey:
          $ref: "#/components/schemas/FoodIconKey"
        iconUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Public URL for a shared illustration in object storage when one
            exists for this food's iconKey. Null when none is stored (clients
            fall back to bundled starter art or generated custom icons).
          example: https://cdn.example.com/foods/custom_cucumber.png
        householdId:
          type: string
          format: uuid
          nullable: true
          description: Null for system starter foods
        system:
          type: boolean
          description: True when the food is a global starter (householdId is null)
        sessionEligible:
          type: boolean
          description: >
            When false, the food is a snack — visible in the catalog but not
            selectable for tasting Plan create/update. System starters are always true.
        liked:
          allOf:
            - $ref: "#/components/schemas/Liked"
          nullable: true
          description: Optional preference (often set for snacks)
        texture:
          allOf:
            - $ref: "#/components/schemas/Texture"
          nullable: true
          description: Optional preference (often set for snacks)
        tasteNote:
          type: string
          maxLength: 100
          nullable: true
          description: Optional free-text taste note (e.g. salt & vinegar); blank clears to null
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the household food is soft-archived; null when active
        exposures:
          type: array
          description: >
            This household's exposure profiles for this food (food + variant).
            Empty when none are set. Used for Plan familiarity autofill.
          items:
            $ref: "#/components/schemas/FoodExposureResponse"
    FoodExposureResponse:
      type: object
      required:
        - foodId
        - variantKey
        - familiarity
        - source
      properties:
        foodId:
          type: string
          format: uuid
        variantKey:
          type: string
          maxLength: 200
          description: >
            Normalized brand/prep note (trim + case-fold). Empty string means
            unspecified presentation.
          example: bagelsaurus
        familiarity:
          $ref: "#/components/schemas/Familiarity"
        source:
          $ref: "#/components/schemas/ExposureSource"
        attemptCount:
          type: integer
          nullable: true
          description: >
            Times this food+variant was completed in a run. Null until the first
            outcome-driven bump (manual/signup upserts do not set it).
          example: 2
        lastTriedOn:
          type: string
          format: date
          nullable: true
          description: >
            Calendar date of the latest completed session that touched this
            exposure (session `scheduledOn`). Null until first outcome bump.
        lastLiked:
          type: string
          nullable: true
          enum: [like, so_so, no]
          description: >
            Liked value from the latest completed outcome for this key. Null
            until first outcome bump (or if liked was omitted).
    StretchTargetResponse:
      type: object
      required:
        - id
        - foodId
        - foodName
        - variantKey
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        foodId:
          type: string
          format: uuid
        foodName:
          type: string
          description: Display name of the nominated tasting food
        variantKey:
          type: string
          maxLength: 200
          description: >
            Normalized brand/prep note (trim + case-fold). Empty string means
            unspecified presentation.
          example: taco night
        createdAt:
          type: string
          format: date-time
    CreateStretchTargetRequest:
      type: object
      description: >
        Nominate with either `foodId` or `name` (not both, not neither).
      properties:
        foodId:
          type: string
          format: uuid
          description: Existing visible tasting food; mutually exclusive with `name`
        name:
          type: string
          maxLength: 200
          description: >
            Match system/household tasting food by name or invent; mutually
            exclusive with `foodId`
        variantKey:
          type: string
          maxLength: 200
          description: Brand/prep note; normalized server-side. Omit or blank for unspecified.
          example: taco night
    UpsertFoodExposureRequest:
      type: object
      required:
        - familiarity
      properties:
        variantKey:
          type: string
          maxLength: 200
          description: Brand/prep note; normalized server-side. Omit or blank for unspecified.
          example: Bagelsaurus
        familiarity:
          $ref: "#/components/schemas/Familiarity"
    ExposureSource:
      type: string
      enum:
        - manual
        - signup
        - outcome
      description: >
        How the exposure familiarity was last written. Manual upsert endpoints
        set `manual`; `POST /api/foods/bootstrap-safes` sets `signup`; completing
        a session writes `outcome` when familiarity changes (or is created).
        Existing `safe` rows keep familiarity on a bad outcome; source stays as
        previously set when only attempt hooks are bumped.
    BootstrapSafeItemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Bagel
        variantKey:
          type: string
          maxLength: 200
          description: Brand/prep note; normalized server-side. Omit or blank for unspecified.
          example: Bagelsaurus
        sessionEligible:
          type: boolean
          default: true
          description: >
            When false, the invented household food is treated as a snack
            (excluded from tasting sessions). Ignored for matched system starters
            (system foods stay session-eligible).
    BootstrapSafesRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 10
          description: Safe foods to bootstrap (0–10). Empty list is allowed.
          items:
            $ref: "#/components/schemas/BootstrapSafeItemRequest"
    CreateFoodRequest:
      type: object
      required:
        - name
        - iconKey
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Extra apple mash
        iconKey:
          $ref: "#/components/schemas/FoodIconKey"
        sessionEligible:
          type: boolean
          default: true
          description: Set false to create a snack (not for tasting sessions)
        liked:
          allOf:
            - $ref: "#/components/schemas/Liked"
          nullable: true
        texture:
          allOf:
            - $ref: "#/components/schemas/Texture"
          nullable: true
        tasteNote:
          type: string
          maxLength: 100
          nullable: true
    UpdateFoodRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Updated mash
        iconKey:
          $ref: "#/components/schemas/FoodIconKey"
        sessionEligible:
          type: boolean
          description: Omit to leave unchanged; false marks as snack
        liked:
          allOf:
            - $ref: "#/components/schemas/Liked"
          nullable: true
          description: Omit to leave unchanged
        texture:
          allOf:
            - $ref: "#/components/schemas/Texture"
          nullable: true
          description: Omit to leave unchanged
        tasteNote:
          type: string
          maxLength: 100
          nullable: true
          description: Omit to leave unchanged; blank string clears to null
      description: Omit a field to leave it unchanged
    Familiarity:
      type: string
      enum:
        - safe
        - familiar_but_new
        - truly_new
        - retrying
      description: >
        How familiar the child is with this food presentation (Plan slot or
        household exposure profile).
    SessionStatus:
      type: string
      enum:
        - planned
        - cancelled
        - completed
    Liked:
      type: string
      enum:
        - like
        - so_so
        - no
      description: Whether the child liked the food during the run
    Texture:
      type: string
      enum:
        - soft
        - crunchy
        - chewy
        - wet
    Temperature:
      type: string
      enum:
        - cold
        - warm
        - hot
    Smell:
      type: string
      enum:
        - like
        - so_so
        - no
      description: Whether the child liked how the food smelled (same scale as Liked)
    TasteBasic:
      type: string
      enum:
        - sweet
        - salty
        - bitter
        - sour
      description: Basic taste words captured on the run (multi-select, optional)
    FoodOutcomeRequest:
      type: object
      required:
        - position
        - ateEnough
      properties:
        position:
          type: integer
          enum: [1, 2]
          description: Which planned food slot (1 or 2)
        liked:
          $ref: "#/components/schemas/Liked"
          nullable: true
        texture:
          $ref: "#/components/schemas/Texture"
          nullable: true
        temperature:
          $ref: "#/components/schemas/Temperature"
          nullable: true
        smell:
          $ref: "#/components/schemas/Smell"
          nullable: true
        tastes:
          type: array
          nullable: true
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TasteBasic"
          description: Optional multi-select taste basics; omit/empty/null means skipped
        whyNote:
          type: string
          maxLength: 500
          nullable: true
          description: Why the child liked or did not like the food (mic or typed)
        changeNote:
          type: string
          maxLength: 500
          nullable: true
          description: What could change to make the food more likable
        ateEnough:
          type: boolean
          description: Parent judgment — did the child eat enough of this food?
    CompleteSessionRequest:
      type: object
      required:
        - foods
      properties:
        foods:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/FoodOutcomeRequest"
    SessionFoodRequest:
      type: object
      required:
        - foodId
        - familiarity
      properties:
        foodId:
          type: string
          format: uuid
          description: Must be a catalog food visible to this household and not archived
        familiarity:
          $ref: "#/components/schemas/Familiarity"
        variantNote:
          type: string
          maxLength: 200
          nullable: true
          description: >
            Optional free-text brand, variety, or prep note. Required (and must
            differ between the two slots, case-insensitive after trim) when both
            foods share the same `foodId`.
          example: Honeycrisp
    CreateSessionRequest:
      type: object
      required:
        - scheduledOn
        - foods
      properties:
        scheduledOn:
          type: string
          format: date
          description: >
            Calendar date for the tasting. Must be today or later. At most one
            planned or completed session per household may use a given date
            (cancelled sessions free the day).
          example: "2026-07-20"
        foods:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SessionFoodRequest"
    UpdateSessionRequest:
      type: object
      required:
        - scheduledOn
        - foods
      properties:
        scheduledOn:
          type: string
          format: date
          description: >
            Calendar date for the tasting. Must be today or later. Moving onto a
            day that already has another planned or completed session is
            rejected; cancelled does not occupy the day.
          example: "2026-07-22"
        foods:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SessionFoodRequest"
    SessionFoodResponse:
      type: object
      required:
        - foodId
        - name
        - iconKey
        - familiarity
        - position
      properties:
        foodId:
          type: string
          format: uuid
        name:
          type: string
          example: Apples
        iconKey:
          $ref: "#/components/schemas/FoodIconKey"
        iconUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Public URL for a shared illustration when one exists for this
            food's iconKey; null otherwise.
        familiarity:
          $ref: "#/components/schemas/Familiarity"
        variantNote:
          type: string
          maxLength: 200
          nullable: true
        position:
          type: integer
          enum: [1, 2]
        liked:
          $ref: "#/components/schemas/Liked"
          nullable: true
        texture:
          $ref: "#/components/schemas/Texture"
          nullable: true
        temperature:
          $ref: "#/components/schemas/Temperature"
          nullable: true
        smell:
          $ref: "#/components/schemas/Smell"
          nullable: true
        tastes:
          type: array
          nullable: true
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TasteBasic"
          description: Selected taste basics from the run; empty/omit when skipped
        whyNote:
          type: string
          maxLength: 500
          nullable: true
        changeNote:
          type: string
          maxLength: 500
          nullable: true
        ateEnough:
          type: boolean
          nullable: true
          description: Set after the session is completed
    UpdateParentNoteRequest:
      type: object
      properties:
        parentNote:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Optional parent context after the tasting. Trimmed on save; blank
            or null clears the stored note.
    SessionResponse:
      type: object
      required:
        - id
        - scheduledOn
        - status
        - foods
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        scheduledOn:
          type: string
          format: date
          example: "2026-07-20"
        status:
          $ref: "#/components/schemas/SessionStatus"
        foods:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SessionFoodResponse"
        parentNote:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional parent notes saved after the kid reward beat
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SuggestionSource:
      type: string
      enum:
        - ai
        - heuristic
      description: Whether the draft came from Gemini Flash or rule-based fallback
    SuggestedSessionFood:
      type: object
      required:
        - name
        - iconKey
        - familiarity
      description: >
        One food in a suggestion draft. Catalog picks set `foodId`. Invent
        proposals set `foodId` to null with a non-blank `proposedName` (optional
        `proposedVariantNote`); they materialize on Approve only. At most one of
        the two foods in a draft may be invent.
      properties:
        foodId:
          type: string
          format: uuid
          nullable: true
          description: >
            Catalog food id. Null when this slot is an invent proposal
            (`proposedName` required); not persisted until Approve.
        name:
          type: string
          example: Apples
          description: >
            Display name. For invent slots this mirrors `proposedName`.
        iconKey:
          type: string
          example: apple
          description: >
            Illustration key. Invent slots may use a placeholder `custom_<slug>`
            until the food is created on Approve.
        iconUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Public URL for a shared illustration when one exists for this
            food's iconKey; null otherwise (typical for invent placeholders).
        familiarity:
          $ref: "#/components/schemas/Familiarity"
        proposedName:
          type: string
          nullable: true
          example: Pickles
          description: >
            Required when `foodId` is null. Proposed adjacent food name; may
            match an existing tasting food by case-insensitive name on Approve.
        proposedVariantNote:
          type: string
          nullable: true
          example: spears
          description: >
            Optional presentation/brand note for an invent slot (maps to
            session variantNote after Approve).
    SessionSuggestionResponse:
      type: object
      required:
        - scheduledOn
        - foods
        - source
      properties:
        scheduledOn:
          type: string
          format: date
          example: "2026-07-16"
          description: >
            Suggested calendar day (UTC) — next day without a planned or completed
            session for this household
        foods:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SuggestedSessionFood"
        rationale:
          type: string
          nullable: true
          description: Optional short calm sentence; omit or null when empty
          example: Keeping it gentle — lean on familiar foods for a bit.
        source:
          $ref: "#/components/schemas/SuggestionSource"
        pacingNote:
          type: string
          nullable: true
          description: >
            Calm parent-facing "why this pace" line from the curated pacing pack
            (distinct from `rationale`). Null only if omitted by older clients;
            current servers always set it from the household pace hint.
          example: Ease off brand-new foods for a bit — familiar favorites keep tasting calm.
        citations:
          type: array
          description: >
            Short plain-language citations supporting `pacingNote`. May be empty.
            Not a clinical bibliography.
          items:
            $ref: "#/components/schemas/PacingCitation"
    PacingCitation:
      type: object
      required:
        - title
        - source
      properties:
        title:
          type: string
          example: Gentle pacing after tough new tries
          description: Short citation title shown to the parent
        source:
          type: string
          example: Feeding therapy guidance on repeated calm exposure
          description: Plain-language source label (not a DOI dump)
    InsightTip:
      type: object
      required:
        - id
        - message
      properties:
        id:
          type: string
          maxLength: 64
          example: keep_going
        message:
          type: string
          example: You're building a tasting rhythm — keep going at a calm pace.
    RecentWhyNote:
      type: object
      required:
        - scheduledOn
        - foodName
        - whyNote
      properties:
        scheduledOn:
          type: string
          format: date
          description: Calendar date of the completed tasting night
        foodName:
          type: string
          example: Apples
        liked:
          allOf:
            - $ref: "#/components/schemas/Liked"
          nullable: true
          description: Liked outcome for that food; null when skipped
        whyNote:
          type: string
          maxLength: 500
          example: tasty, crunchy — liked the peel
    InsightsResponse:
      type: object
      required:
        - completedSessionCount
        - ready
        - ateEnoughYes
        - ateEnoughNo
        - likedLike
        - likedSoSo
        - likedNo
        - likedSkipped
        - topLikedTextures
        - topLikedTastes
        - familiaritySafe
        - familiarityFamiliarButNew
        - familiarityTrulyNew
        - snackCount
        - hasParentNotes
        - recentWhyNotes
        - tips
      properties:
        completedSessionCount:
          type: integer
          minimum: 0
        ready:
          type: boolean
          description: True when completedSessionCount >= 3
        ateEnoughYes:
          type: integer
          minimum: 0
        ateEnoughNo:
          type: integer
          minimum: 0
        likedLike:
          type: integer
          minimum: 0
          description: Merged session outcomes + snack liked=like
        likedSoSo:
          type: integer
          minimum: 0
        likedNo:
          type: integer
          minimum: 0
        likedSkipped:
          type: integer
          minimum: 0
          description: Session outcomes with null liked only (snacks never skipped)
        topLikedTextures:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - soft
              - crunchy
              - chewy
              - wet
          description: Texture names ranked by count among merged liked=like rows
        topLikedTastes:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TasteBasic"
          description: >
            Taste basics ranked by count among completed session foods with
            liked=like and non-empty tastes (session outcomes only; snacks excluded)
        familiaritySafe:
          type: integer
          minimum: 0
        familiarityFamiliarButNew:
          type: integer
          minimum: 0
        familiarityTrulyNew:
          type: integer
          minimum: 0
        snackCount:
          type: integer
          minimum: 0
          description: Active (non-archived) snack foods for the household
        hasParentNotes:
          type: boolean
        recentWhyNotes:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RecentWhyNote"
          description: >
            Newest completed-food why notes (non-blank), up to 5 when ready;
            empty when not ready or none recorded
        tips:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/InsightTip"
          description: Empty when not ready; otherwise 0–3 non-dismissed tips
