spring:
  application:
    name: quickapp
  # Local defaults (Docker Compose). On Render/Neon override with env — never commit
  # real credentials:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://…/neondb?sslmode=require
  #   SPRING_DATASOURCE_USERNAME=…
  #   SPRING_DATASOURCE_PASSWORD=…
  datasource:
    url: jdbc:postgresql://localhost:5432/quickapp
    username: quickapp
    password: quickapp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Render sets PORT; local default remains 8080.
server:
  port: ${PORT:8080}

# Ops keep-alive / platform probes — not part of the product OpenAPI contract.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Session TTLs for opaque Bearer sessions (remember vs session-only).
app:
  auth:
    session-ttl:
      remember: 30d
      session-only: 12h
  # Comma-separated extra browser origins (e.g. Render static site URL).
  # Localhost Vite origins are always included — see CorsConfig.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  calendar:
    # Household calendar day for Plan/Run “today” (not server UTC).
    zone: ${APP_CALENDAR_ZONE:America/New_York}
  food-illustrations:
    # S3-compatible (R2) — when endpoint/bucket/keys unset, in-memory double (tests/dev).
    endpoint: ${FOOD_ILLUSTRATIONS_ENDPOINT:}
    bucket: ${FOOD_ILLUSTRATIONS_BUCKET:}
    access-key: ${FOOD_ILLUSTRATIONS_ACCESS_KEY:}
    secret-key: ${FOOD_ILLUSTRATIONS_SECRET_KEY:}
    region: ${FOOD_ILLUSTRATIONS_REGION:auto}
    public-base-url: ${FOOD_ILLUSTRATIONS_PUBLIC_BASE_URL:http://127.0.0.1/food-illustrations}
